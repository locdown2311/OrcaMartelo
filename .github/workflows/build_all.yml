name: Build Windows

on:
  push:
    branches:
     - main
     - release/*
     - v2.5.0-custom
    paths:
     - 'deps/**'
     - 'deps_src/**'
     - 'cmake/**'
     - 'src/**'
     - '**/CMakeLists.txt'
     - 'version.inc'
     - 'localization/**'
     - 'resources/**'
     - ".github/workflows/build_*.yml"
     - 'build_win.bat'
     - 'scripts/test_build_win.ps1'
     - 'scripts/msix/**'
     - 'tests/**'

  pull_request:
    branches:
     - main
     - release/*
     - v2.5.0-custom
    paths:
     - 'deps/**'
     - 'deps_src/**'
     - 'cmake/**'
     - 'src/**'
     - '**/CMakeLists.txt'
     - 'version.inc'
     - ".github/workflows/build_*.yml"
     - 'build_win.bat'
     - 'scripts/test_build_win.ps1'
     - 'scripts/msix/**'
     - 'tests/**'

  workflow_dispatch: # allows for manual dispatch
    inputs:
      build-deps-only:
        description: 'Only build dependencies (bypasses caching)'
        type: boolean
        default: false

concurrency:
  # cancel_closed_pr_builds.yml joins this group by name, so update that file
  # with any change here.
  group: build-all-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Pushes don't cancel a running build, because only a finished branch build
  # saves caches every pull request can restore.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  actions: write

jobs:
  # build_win.bat ships a test suite. Run it before the Windows builds.
  check_build_script:
    name: Windows build script tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: 'false'

      # Windows PowerShell rather than pwsh: the suite drives build_win.bat
      # through cmd, and the two differ in how they quote native arguments.
      - name: Run the build script test suite
        shell: powershell
        run: .\scripts\test_build_win.ps1

  build_windows:
    name: Build Windows x64
    needs: check_build_script
    if: ${{ !cancelled() && needs.check_build_script.result == 'success' }}
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ vars.SELF_HOSTED && 'orca-win-server' || 'windows-latest' }}
      arch: x64
      compiler: clang
      build-deps-only: ${{ inputs.build-deps-only || false }}
    secrets: inherit
